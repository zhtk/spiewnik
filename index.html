<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c8a96e">
  <meta name="description" content="Harcerski i żeglarski śpiewnik z akordami">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Śpiewnik">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="manifest" href="manifest.json">
  <title>Śpiewnik</title>

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/modes.css">

  <!-- CDN libs (loaded before ES module app.js) -->
  <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
</head>
<body>
<div id="app">

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <span class="app-logo">⚓ Śpiewnik</span>
    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="Szukaj piosenki lub słów…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="search-clear" hidden aria-label="Wyczyść">✕</button>
    </div>
    <button id="menu-btn" class="icon-btn" aria-label="Menu">
      <!-- Hamburger icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="5" width="18" height="2" rx="1"/>
        <rect x="3" y="11" width="18" height="2" rx="1"/>
        <rect x="3" y="17" width="18" height="2" rx="1"/>
      </svg>
    </button>
  </header>

  <!-- ── Offline banner ──────────────────────────────────────────────────── -->
  <div id="offline-banner" hidden>📵 Tryb offline — śpiewnik dostępny z pamięci</div>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <main>
    <!-- List view -->
    <div id="list-view">
      <div id="content"></div>
    </div>

    <!-- Song view -->
    <div id="song-view" hidden>
      <div class="back-header">
        <button id="back-btn" aria-label="Wróć">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          Lista
        </button>
      </div>
      <div id="song-view-content"></div>
    </div>
  </main>

</div>

<!-- ── Drawer ───────────────────────────────────────────────────────────────── -->
<div id="overlay"></div>
<aside id="drawer" role="dialog" aria-label="Menu">
  <div class="drawer-header">
    <span class="drawer-title">Ustawienia</span>
    <button id="drawer-close" class="drawer-close" aria-label="Zamknij">✕</button>
  </div>

  <!-- Sync -->
  <div class="drawer-section">
    <div class="drawer-section-label">Synchronizacja</div>
    <button id="sync-btn" class="drawer-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
      </svg>
      Aktualizuj śpiewnik
    </button>
    <div id="sync-status"></div>
  </div>

  <!-- Install -->
  <div id="install-section" class="drawer-section" hidden>
    <div class="drawer-section-label">Aplikacja</div>
    <button id="install-btn" class="drawer-btn" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5z"/>
      </svg>
      Zainstaluj aplikację
    </button>
    <button id="uninstall-btn" class="drawer-btn" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
      </svg>
      Odinstaluj
    </button>
  </div>

  <!-- Display mode -->
  <div class="drawer-section">
    <div class="drawer-section-label">Widok nut/akordów</div>
    <div class="drawer-select-wrap">
      <select id="mode-select" aria-label="Tryb wyświetlania">
        <option value="text">Tylko słowa</option>
        <option value="chords-inline">Słowa + akordy (linia pod linią)</option>
        <option value="chords-split">Słowa | Akordy obok siebie (tablet)</option>
      </select>
    </div>
  </div>

  <!-- Category filters -->
  <div class="drawer-section">
    <div class="drawer-section-label">Kategorie</div>
    <div id="category-filters"></div>
  </div>
</aside>

<!-- ── Toast ─────────────────────────────────────────────────────────────────── -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- App JS (ES module) -->
<script type="module" src="js/app.js"></script>

<!-- Register service worker -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
