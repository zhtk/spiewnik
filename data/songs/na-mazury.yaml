id: na-mazury
title: Na Mazury
category: sailors
key: D
tags: [szanta, mazury, zeglowanie]

verses:
  - type: verse
    label: Zwrotka 1
    lines:
      - text: Się masz, witam Cię, piękną sprawę mam,
        chords: "D A D"
      - text: Pakuj bety swe i leć ze mną tam,
        chords: "D A D"
      - text: Rzuć kłopotów stos, no nie wykręcaj się,
        chords: "G D A D"
      - text: Całuj wszystko w nos,
        chords: "G D"
      - text: Osobowym drugą klasą przejedziemy się.
        chords: "A"

  - type: chorus
    label: Refren
    lines:
      - text: Na Mazury, Mazury, Mazury,
        chords: "D G D"
      - text: Popływamy tą łajbą z tektury,
        chords: "D A D"
      - text: Na Mazury, gdzie wiatr zimny wieje,
        chords: "D G D"
      - text: Gdzie są ryby i grzyby, i knieje.
        chords: "D A D"
      - text: Tam, gdzie fale nas bujają,
        chords: "G D"
      - text: Gdzie się ludzie opalają,
        chords: "A D"
      - text: Wschody słońca piękne są
        chords: "G D"
      - text: I komary w dupę tną.
        chords: "A D"
      - text: Gdzie przy ogniu gra muzyka
        chords: "G D"
      - text: I gorzała w gardłach znika,
        chords: "A D"
      - text: A Pan Leśniczy nie wiadomo skąd
        chords: "G A"
      - text: Woła do nas, do nas, do nas...
        chords: "A"
      - text: '"...Paszła won!"'
        chords: "D"

  - type: verse
    label: Zwrotka 2
    lines:
      - text: Uszczelniłem dno, lekko chodzi miecz,
        chords: "D A D"
      - text: Zęzy smrodów sto przewietrzyłem precz,
        chords: "D A D"
      - text: Ster nie spada już i grot luzuje się,
        chords: "G D A D"
      - text: Więc się ze mną rusz,
        chords: "G D"
      - text: Już nie będzie tak jak wtedy, nie denerwuj się.
        chords: "A"

  - type: verse
    label: Zwrotka 3
    lines:
      - text: Skrzynkę piwa mam, Ty otwieracz weź,
        chords: "D A D"
      - text: Napić Ci się dam, tylko mi ją nieś,
        chords: "D A D"
      - text: Coś rozdziawił dziób i masz głupi wzrok?
        chords: "G D A D"
      - text: No nie stój jak ten słup,
        chords: "G D"
      - text: Z Węgorzewa na Ruciane wykonamy skok.
        chords: "A"
