id: marco-polo
title: Marco Polo
category: sailors
key: Em
tags: [szanta, morze, zeglowanie]

verses:
  - type: verse
    label: Zwrotka 1
    lines:
      - text: Nasz "Marco Polo" to dzielny ship,
        chords: "Em G D Em"
      - text: Największe fale brał.
        chords: "Em G"
      - text: W Australii będąc widziałem go,
        chords: "C Em G D"
      - text: Gdy w porcie przy kei stał.
        chords: "Em D Em"
      - text: I urzekł mnie tak urodą swą,
        chords: "Em G D Em"
      - text: Że zaciągnąłem się
        chords: "Em G"
      - text: I powiał wiatr, w dali zniknął ląd,
        chords: "C Em G D"
      - text: Mój dom i Australii brzeg.
        chords: "Em D Em"

  - type: chorus
    label: Refren
    lines:
      - text: '"Marco Polo"'
        chords: "Em D C B7"
      - text: W królewskich liniach był.
        chords: "Em D Em"
      - text: '"Marco Polo"'
        chords: "Em D C B7"
      - text: Tysiące przebył mil.
        chords: "Em D Em"

  - type: verse
    label: Zwrotka 2
    lines:
      - text: Na jednej z wysp za korali sznur
        chords: "Em G D Em"
      - text: Tubylec złoto dał
        chords: "Em G"
      - text: I poszli wszyscy w ten dziki kraj,
        chords: "C Em G D"
      - text: Bo złoto mieć każdy chciał.
        chords: "Em D Em"
      - text: I wielkie szczęście spotkało tych,
        chords: "Em G D Em"
      - text: Co wyszli na ten brzeg,
        chords: "Em G"
      - text: Bo pełne złota ładownie są
        chords: "C Em G D"
      - text: I każdy bogaczem jest.
        chords: "Em D Em"

  - type: verse
    label: Zwrotka 3
    lines:
      - text: W powrotnej drodze tak szalał sztorm,
        chords: "Em G D Em"
      - text: Że drzazgi poszły z rej,
        chords: "Em G"
      - text: A statek wciąż burtą wodę brał,
        chords: "C Em G D"
      - text: Do dna było coraz mniej.
        chords: "Em D Em"
      - text: Ładunek cały trza było nam
        chords: "Em G D Em"
      - text: Do morza wrzucić tu,
        chords: "Em G"
      - text: Do lądu dojść i biedakiem być,
        chords: "C Em G D"
      - text: Ratować choć żywot swój.
        chords: "Em D Em"
