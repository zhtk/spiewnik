id: tancowanie
title: Tańcowanie
category: sailors
key: D
tags: [szanta, taniec, zeglowanie]

verses:
  - type: verse
    label: Zwrotka 1
    lines:
      - text: Kiedy forsy nie masz, kiedy głowa Cię boli,
        chords: "D"
      - text: Kiedy żona hetera płynąć w rejs nie pozwoli,
        chords: "A"
      - text: Kiedy dzieci płaczą i jest bardzo źle -
        chords: "D"
      - text: Tańcz z nami bracie i nie przejmuj się.
        chords: "A D"

  - type: chorus
    label: Refren
    lines:
      - text: I... Tańcz, tańcz, tańcz z nami i Ty,
        chords: "D"
      - text: Tańcz z nami bracie, by wióry szły,
        chords: "D A"
      - text: Wypij aż do dna za przygody złe,
        chords: "D"
      - text: Tańcz z nami bracie i nie przejmuj się.
        chords: "A D"
    bis: refren x2

  - type: verse
    label: Zwrotka 2
    lines:
      - text: Kiedy wiatr ucichnie, płynąć nie ma nadziei,
        chords: "D"
      - text: Wtedy z bracią żeglarską diabeł hula na kei,
        chords: "A"
      - text: Beczki piwa z knajpy czart wytacza dwie,
        chords: "D"
      - text: A pijany żeglarz zaraz tańczyć chce.
        chords: "A D"

  - type: verse
    label: Zwrotka 3
    lines:
      - text: Tańczą rybki w morzu i dziewuszki na plaży,
        chords: "D"
      - text: Cała knajpa tańczy z pijaniutkim żeglarzem.
        chords: "A"
      - text: Patrz - na stole tańczą białe myszki dwie,
        chords: "D"
      - text: Skaczą sobie miło i nie przejmują się.
        chords: "A D"

  - type: verse
    label: Zwrotka 4
    lines:
      - text: Tańczy Jimmy i Johnny, i Maggie nieśmiała,
        chords: "D"
      - text: Skacze sobie wesoło kompanija nasza cała,
        chords: "A"
      - text: Słodki Kubuś z nami także skakać chce,
        chords: "D"
      - text: Lecz nóżki poplątał i na keję legł.
        chords: "A D"

  - type: verse
    label: Zwrotka 5
    lines:
      - text: Tańczy jedna nóżka frywolna i zgrabna,
        chords: "D"
      - text: Za nią druga podskoczy wesoła i powabna,
        chords: "A"
      - text: Na koniec brzuszek wytacza się,
        chords: "D"
      - text: Tylko główka nie chce - z nią jest bardzo źle...
        chords: "A D"
