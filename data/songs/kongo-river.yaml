id: kongo-river
title: Kongo River
category: sailors
key: D
tags: [szanta, morze, zeglowanie]

verses:
  - type: verse
    label: Zwrotka 1
    lines:
      - text: Czy byłeś kiedyś tam nad Kongo River?
        chords: "D G Em"
      - text: "- Razem, hoo!"
        chords: "D G"
      - text: Tam febra niezle zbiera żniwo.
        chords: "D A D"
      - text: "- Razem weźmy go, hoo!"
        chords: "G D A D"

  - type: chorus
    label: Refren
    lines:
      - text: Brać się chłopcy, brać, a żywo!
        chords: "D G Em"
      - text: "- Razem, hoo!"
        chords: "D G"
      - text: Cholerne brzegi Kongo River!
        chords: "D A D"
      - text: "- Razem weźmy go, hoo!"
        chords: "G D A D"

  - type: verse
    label: Zwrotka 2
    lines:
      - text: Jankeski okręt w rzekę wpłynął,
        chords: "D G Em D G D A D G D A D"
      - text: Tam błyszczą reje barwą żywą.

  - type: verse
    label: Zwrotka 3
    lines:
      - text: Skąd wiesz, że okręt to jankeski?
        chords: "D G Em D G D A D G D A D"
      - text: Zbroczone krwią pokładu deski.

  - type: verse
    label: Zwrotka 4
    lines:
      - text: Ach, Kongo River, a potem Chiny,
        chords: "D G Em D G D A D G D A D"
      - text: W kabinach same sukinsyny.

  - type: verse
    label: Zwrotka 5
    lines:
      - text: Ach, powiedz, kto tam jest kapitanem?
        chords: "D G Em D G D A D G D A D"
      - text: John Mokra Śliwa - stary palant.

  - type: verse
    label: Zwrotka 6
    lines:
      - text: A kto tam jest pierwszym oficerem?
        chords: "D G Em D G D A D G D A D"
      - text: Sam Tander Jim, cwana cholera.

  - type: verse
    label: Zwrotka 7
    lines:
      - text: A kogo tam mają za drugiego?
        chords: "D G Em D G D A D G D A D"
      - text: Sarape - Johna Piekielnego.

  - type: verse
    label: Zwrotka 8
    lines:
      - text: A bosman - czarnuch zaplesniały,
        chords: "D G Em D G D A D G D A D"
      - text: Jack z Frisco liże mu sandały.

  - type: verse
    label: Zwrotka 9
    lines:
      - text: Kuk lubi z chłopcem pobaraszkowac
        chords: "D G Em D G D A D G D A D"
      - text: I nie ma czasu by gotować.

  - type: verse
    label: Zwrotka 10
    lines:
      - text: Jak myślisz, co mają na śniadanie?
        chords: "D G Em D G D A D G D A D"
      - text: Tę wodę, co miał kuk w kolanie.

  - type: verse
    label: Zwrotka 11
    lines:
      - text: Jak myślisz, co na obiad zjedzą?
        chords: "D G Em D G D A D G D A D"
      - text: Z handszpaka stek polany zeza.

  - type: verse
    label: Zwrotka 12
    lines:
      - text: Nie zgadniesz, jaki tam jest ładunek -
        chords: "D G Em D G D A D G D A D"
      - text: Z plugawych tawern sto dziewczynek.
