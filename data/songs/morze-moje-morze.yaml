id: morze-moje-morze
title: Morze, moje morze
category: sailors
key: Am
tags: [szanta, morze, zeglowanie]

verses:
  - type: verse
    label: Zwrotka 1
    lines:
      - text: Hej, me Bałtyckie Morze,
        chords: "Am E Am"
      - text: Wdzięczny Ci jestem bardzo,
        chords: "C G C"
      - text: Toś Ty mnie wychowało,
        chords: "Dm G"
      - text: Toś Ty mnie wychowało,
        chords: "C Dm"
      - text: Szkoły mi dało twardą.
        chords: "Am E Am"
    bis: x2 (wersy 3-5)

  - type: verse
    label: Zwrotka 2
    lines:
      - text: Szkoły mi dało twardą,
        chords: "Am E Am"
      - text: Uczyło łodzią pływać,
        chords: "C G C"
      - text: Żagle pięknie cerować,
        chords: "Dm G"
      - text: Żagle pięknie cerować,
        chords: "C Dm"
      - text: Codziennie pokład zmywać.
        chords: "Am E Am"
    bis: x2 (wersy 3-5)

  - type: verse
    label: Zwrotka 3
    lines:
      - text: Codziennie pokład zmywać
        chords: "Am E Am"
      - text: Od soli i od kurzy,
        chords: "C G C"
      - text: Mosiądze wyglansować,
        chords: "Dm G"
      - text: Mosiądze wyglansować,
        chords: "C Dm"
      - text: W ciszy, czy w czasie burzy.
        chords: "Am E Am"
    bis: x2 (wersy 3-5)

  - type: verse
    label: Zwrotka 4
    lines:
      - text: W ciszy, czy w czasie burzy,
        chords: "Am E Am"
      - text: Trzeba przy pracy śpiewać,
        chords: "C G C"
      - text: Bo kiedy śpiewu nie ma,
        chords: "Dm G"
      - text: Bo kiedy śpiewu nie ma,
        chords: "C Dm"
      - text: Neptun się będzie gniewać.
        chords: "Am E Am"
    bis: x2 (wersy 3-5)

  - type: verse
    label: Zwrotka 5
    lines:
      - text: Neptun się będzie gniewać
        chords: "Am E Am"
      - text: I klątwę brzydką rzuci,
        chords: "C G C"
      - text: Wpakuje na mieliznę,
        chords: "Dm G"
      - text: Wpakuje na mieliznę,
        chords: "C Dm"
      - text: Albo nam łódź wywróci.
        chords: "Am E Am"
    bis: x2 (wersy 3-5)

  - type: verse
    label: Zwrotka 6
    lines:
      - text: Albo nam łódź wywróci
        chords: "Am E Am"
      - text: 'I krzyknie - "Hej partacze!'
        chords: "C G C"
      - text: Nakarmię wami rybki,
        chords: "Dm G"
      - text: Nakarmię wami rybki,
        chords: "C Dm"
      - text: Nikt po was nie zapłacze!"
        chords: "Am E Am"
    bis: x2 (wersy 3-5)
