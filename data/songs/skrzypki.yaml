id: skrzypki
title: Skrzypki
category: sailors
key: Em
tags: [szanta, morze, taniec]

verses:
  - type: verse
    label: Zwrotka 1
    lines:
      - text: Gdy do wora spakowałem już
        chords: "Em"
      - text: 'Wszystko, co na świecie mam:'
        chords: "D"
      - text: Zbiór pamiątek z egzotycznych mórz,
        chords: "Em"
      - text: Butlę rumu, wina dzban.
        chords: "G D Em"
      - text: Jeszcze tylko raz spojrzę dziś na port,
        chords: "G D"
      - text: Jutro odpływamy w dal.
        chords: "C Bm"
      - text: Jak to dobrze, że są obok mnie
        chords: "Em"
      - text: Moje skrzypki, stary wrak.
        chords: "G D Em"

  - type: chorus
    label: Refren
    lines:
      - text: Kiedy biorę w dłonie skrzypki swe
        chords: "Em"
      - text: I one zaczynają grać,
        chords: "D"
      - text: Wszyscy tańczą skoczną polkę tą
        chords: "Em"
      - text: Razem do białego dnia
        chords: "G D Em"

  - type: verse
    label: Zwrotka 2
    lines:
      - text: One grają mi, gdzie pojawię się
        chords: "Em"
      - text: I do tańca dają znak.
        chords: "D"
      - text: Nuty z wielu znanych pieśni grają,
        chords: "Em"
      - text: A w większości szant.
        chords: "G D Em"
      - text: Kiedy łajba ma wita nowy świat
        chords: "G D"
      - text: To przypominają mi,
        chords: "C Bm"
      - text: Że daleko gdzieś czeka zawsze ktoś
        chords: "Em"
      - text: Abym zagrał jeszcze raz.
        chords: "G D Em"

  - type: verse
    label: Zwrotka 3
    lines:
      - text: Kiedy smykiem ciągnę polki rytm
        chords: "Em"
      - text: A palce zaczynają bieg
        chords: "D"
      - text: Wszystko wkoło jakby lepsze jest
        chords: "Em"
      - text: I raźniej żyje się.
        chords: "G D Em"
      - text: A po rejsie, gdy rozpakuję wór,
        chords: "G D"
      - text: I osuszę rumu dzban,
        chords: "C Bm"
      - text: Stare skrzypki znów przypomną mi,
        chords: "Em"
      - text: Aby nogi poszły w tan.
        chords: "G D Em"
