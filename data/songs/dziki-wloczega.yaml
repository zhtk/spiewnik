id: dziki-wloczega
title: Dziki włóczęga
category: sailors
key: G
tags: [szanta, morze, zeglowanie]

verses:
  - type: verse
    label: Zwrotka 1
    lines:
      - text: Byłem dzikim włóczęgą przez tak wiele dni,
        chords: "G D G C"
      - text: Przepuściłem pieniądze na dziwki i gin.
        chords: "G C D G"
      - text: Dzisiaj wracam do domu, pełny złota mam trzos,
        chords: "G D G C"
      - text: I zapomnieć chcę wreszcie, jak podły był los.
        chords: "G C D G"

  - type: chorus
    label: Refren
    lines:
      - text: Już nie wrócę na morze
        chords: "D"
      - text: Nigdy więcej, o nie!
        chords: "G C"
      - text: Wreszcie koniec włóczęgi,
        chords: "G C"
      - text: Na pewno to wiem!
        chords: "D G"

  - type: verse
    label: Zwrotka 2
    lines:
      - text: I poszedłem do baru, gdzie bywałem nie raz,
        chords: "G D G C"
      - text: Powiedziałem barmance, że forsy mi brak.
        chords: "G C D G"
      - text: 'Poprosiłem o kredyt, powiedziała: "Idź precz!'
        chords: "G D G C"
      - text: 'Mogę mieć tu stu takich na skinienie co dzień."'
        chords: "G C D G"

  - type: verse
    label: Zwrotka 3
    lines:
      - text: Gdy błysnąłem dziesiątką, to skoczyła jak kot
        chords: "G D G C"
      - text: I butelkę najlepszą przysunęła pod nos.
        chords: "G C D G"
      - text: 'Powiedziała zalotnie: "Co chcesz, mogę Ci dać."'
        chords: "G D G C"
      - text: 'Ja jej na to: "Ty fladro, spadaj, znam inny bar."'
        chords: "G C D G"

  - type: verse
    label: Zwrotka 4
    lines:
      - text: Gdy stanąłem przed domem, przez otwarte drzwi
        chords: "G D G C"
      - text: Zobaczyłem rodziców - czy przebaczą mi?
        chords: "G C D G"
      - text: Matka pierwsza spostrzegła, jak w sieni wciąż tkwię,
        chords: "G D G C"
      - text: 'Zobaczyłem ich radość i przyrzekłem, że:'
        chords: "G C D G"
