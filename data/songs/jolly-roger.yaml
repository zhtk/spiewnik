id: jolly-roger
title: Jolly Roger
category: sailors
key: Am
tags: [szanta, piraci, korsarz]

verses:
  - type: verse
    label: Zwrotka 1
    lines:
      - text: Śmiejesz się do mnie draniu, gdy brew wznoszę swą do góry
        chords: "Am F"
      - text: I kiedy pokład pełen krwi, gdy ginie wróg jak szczury,
        chords: "C Dm E"
      - text: Gdy nagiel-zupa szkodzi mi i batem grzbiet pocięty,
        chords: "F C Dm E"
      - text: Przedrzeźniasz wtedy moją twarz na płótnie rozciągnięty.
        chords: "Am G C Dm E"

  - type: chorus
    label: Refren
    lines:
      - text: Jolly Roger zmarnował życie mi,
        chords: "Am G"
      - text: Jolly Roger w hiszpańskiej tonie krwi,
        chords: "C G"
      - text: Jolly Roger otuli was na dnie,
        chords: "Dm Am"
      - text: Jolly Roger, Roger, ukryjcie lepiej się!
        chords: "F E"
      - text: Na, na, na...
        chords: "Am F C Dm E"
    bis: refren x2

  - type: verse
    label: Zwrotka 2
    lines:
      - text: A on czerwony wkłada płaszcz na chude swe piszczele.
        chords: "Am F"
      - text: Nikt jeńców dziś nie będzie brał, ech, co tu gadać wiele.
        chords: "C Dm E"
      - text: I tylko szansę przeżyć ma ten, kto się szybko podda,
        chords: "F C Dm E"
      - text: Gdy Jolly w czarnych szatach lśni na szczycie w blasku ognia.
        chords: "Am G C Dm E"

  - type: verse
    label: Zwrotka 3
    lines:
      - text: Nad moją głową wisi wciąż ta niepokorna flaga,
        chords: "Am F"
      - text: A pod nią co dzień krew i łzy, tchórzostwo i odwaga,
        chords: "C Dm E"
      - text: I choć widziałem już nieraz okryty okręt chmurą,
        chords: "F C Dm E"
      - text: "Z Jolly'm śmiejemy zawsze się, bo Jolly zawsze górą."
        chords: "Am G C Dm E"
