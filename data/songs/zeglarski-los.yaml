id: zeglarski-los
title: Żeglarski los
category: sailors
key: C
tags: [szanta, morze, zeglowanie]

verses:
  - type: chorus
    label: Refren
    lines:
      - text: Hej-ahoj! Żeglarski los!
        chords: "C A7 D"
      - text: Dziś pełen, a jutro znów pusty masz trzos.
        chords: "A7 G D A7 D"

  - type: verse
    label: Zwrotka 1
    lines:
      - text: Z Liverpool do Frisco wybrałem się raz,
        chords: "D A7 D"
      - text: Myślałem pozostać tam przez dłuższy czas.
        chords: "A7 D A7 D"
      - text: Dziewczyny i whisky sprawiły wszak, że
        chords: "D A7 D"
      - text: Już wkrótce znów do Liverpool wieźli mnie.
        chords: "A7 D A7 D C"

  - type: verse
    label: Zwrotka 2
    lines:
      - text: Staliśmy w zatoce czekając na wiatr,
        chords: "D A7 D"
      - text: Nasz statek żałośnie się kiwał bez szmat.
        chords: "A7 D A7 D"
      - text: Podobnie załoga kiwała się, bo
        chords: "D A7 D"
      - text: W butelkach po whisky widniało już dno.
        chords: "A7 D A7 D C"

  - type: verse
    label: Zwrotka 3
    lines:
      - text: Niedługo trwał spokój, godzinę czy dwie,
        chords: "D A7 D"
      - text: Bo Pierwszy już zadbał, by nie nudzić się.
        chords: "A7 D A7 D"
      - text: 'Gdy nagle zaryczał: "Do żagli, co tchu!"'
        chords: "D A7 D"
      - text: Nie wspomnę, co na to krzyknęliśmy mu.
        chords: "A7 D A7 D C"

  - type: verse
    label: Zwrotka 4
    lines:
      - text: Do dziś pamiętam ponurą tę noc,
        chords: "D A7 D"
      - text: Wkrąg morze kipiało i tęgi wiatr dął.
        chords: "A7 D A7 D"
      - text: Choć wszystko trzeszczało od topu po kil,
        chords: "D A7 D"
      - text: W godzinę dwanaście robiliśmy mil.
        chords: "A7 D A7 D C"

  - type: verse
    label: Zwrotka 5
    lines:
      - text: '"Za zdrowie Starego!" Wypijmy do dna,'
        chords: "D A7 D"
      - text: Bo równy to chłop i swój fach dobrze zna.
        chords: "A7 D A7 D"
      - text: Pierwszego pominmy, bo każdy to wie,
        chords: "D A7 D"
      - text: Że lepiej, by w ręce nie dostał nam się.
        chords: "A7 D A7 D C"
