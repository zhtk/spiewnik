id: zegluj-zegluj
title: Żegluj, żegluj
category: sailors
key: Am
tags: [szanta, morze, zeglowanie]

verses:
  - type: chorus
    label: Refren
    lines:
      - text: Żegluj, żegluj, tam gdzie Nowa Szkocja.
        chords: "C Em Am F G"
      - text: Żegluj, żegluj, gdzie wstaje nowy dzień.
        chords: "C Em Am F G C"

  - type: verse
    label: Zwrotka 1
    lines:
      - text: Głos Nowej Szkocji nam przynosi wiatr,
        chords: "Am G C"
      - text: To zapowiedź nowych dni.
        chords: "F C F"
      - text: Znowu woła do nas rykiem fal,
        chords: "Dm C G Am"
      - text: Tam znajdziecie nowy świat.
        chords: "F C G"
      - text: Znów dumny brzeg będzie witał was
        chords: "Am G C"
      - text: Majestatem groźnych skał.
        chords: "F C F"
      - text: Każdy dzień tu świtem przywita was,
        chords: "Dm C G Am"
      - text: Coraz bliższym stanie się,
        chords: "F C F"
      - text: Twoim własnym domem stanie się.
        chords: "Dm G C"
    bis: refren x2

  - type: verse
    label: Zwrotka 2
    lines:
      - text: Atlantyk bije falą w stromy brzeg,
        chords: "Am G C"
      - text: Wściekle ryczy pośród skał.
        chords: "F C F"
      - text: W górze dzikich ptaków słychać śpiew,
        chords: "Dm C G Am"
      - text: Głos ich płynie z wiatrem w dal.
        chords: "F C G"
      - text: Tam bujnej trawy się kołysze łan
        chords: "Am G C"
      - text: I strumyków cichy szept.
        chords: "F C F"
      - text: W mej pamięci zawsze będzie trwał,
        chords: "Dm C G Am"
      - text: Lecz niedługo powiem wam,
        chords: "F C F"
      - text: Lecz niedługo wszystkim powiem wam...
        chords: "Dm G C"
    bis: refren x3
