id: bijatyka
title: Dwudziesty czwarty lutego (Bijatyka)
category: sailors
key: C
tags: [szanta, walka, piraci]

verses:
  - type: verse
    label: Zwrotka 1
    lines:
      - text: To dwudziesty czwarty był lutego,
        chords: "C"
      - text: Poranna zrzedła mgła,
        chords: "C G"
      - text: Wyszło z niej siedem uzbrojonych kryp,
        chords: "Am"
      - text: Turecki niosły znak.
        chords: "Am G Am"

  - type: chorus
    label: Refren
    lines:
      - text: No i...
      - text: Znów bijatyka, no i...
        chords: "C"
      - text: Znów bijatyka, no i...
        chords: "C"
      - text: Bijatyka cały dzień, [dzień! dzień!]
        chords: "C G"
      - text: I porąbany dzień, i porąbany łeb,
        chords: "Am"
      - text: Razem bracia, aż po zmierzch!
        chords: "Am G Am"
      - text: Hej!
    bis: refren x2

  - type: verse
    label: Zwrotka 2
    lines:
      - text: Już pierwszy skrada się do burt,
        chords: "C"
      - text: 'A zwie się "Goździk" i'
        chords: "C G"
      - text: Z Algieru Pasza wysłał go,
        chords: "Am"
      - text: Żeby nam upuścił krwi.
        chords: "Am G Am"

  - type: verse
    label: Zwrotka 3
    lines:
      - text: Następny zbliża się do burt,
        chords: "C"
      - text: 'A zwie się "Róży Pąk".'
        chords: "C G"
      - text: Plunęliśmy ze wszystkich rur -
        chords: "Am"
      - text: Bardzo prędko szedł na dno.
        chords: "Am G Am"

  - type: verse
    label: Zwrotka 4
    lines:
      - text: W naszych rękach dwa i dwa na dnie,
        chords: "C"
      - text: Cała reszta zwiała gdzieś,
        chords: "C G"
      - text: No a jeden z nich zabraliśmy
        chords: "Am"
      - text: Na starej Anglii brzeg.
        chords: "Am G Am"
